
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lecteur vidéo multi-plateforme</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #101010;
      color: #f5f5f5;
      font: 16px/1.5 system-ui, sans-serif;
    }
    main { max-width: 900px; margin: auto; }
    form { display: flex; gap: 10px; margin: 20px 0; }
    input, button {
      padding: 12px;
      border-radius: 8px;
      font: inherit;
    }
    input {
      flex: 1;
      min-width: 0;
      background: #202020;
      color: white;
      border: 1px solid #555;
    }
    button { cursor: pointer; border: 0; }
    .play { background: #ff9900; font-weight: bold; }
    .player {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #050505;
      border-radius: 10px;
      overflow: hidden;
    }
    iframe { width: 100%; height: 100%; border: 0; }
    #message { overflow-wrap: anywhere; color: #ccc; }
    @media (max-width: 560px) {
      form { flex-direction: column; }
    }
  </style>
</head>
<body>
<main>
  <h1>Lecteur vidéo</h1>
  <p>
    Colle un lien vidéo ou, de préférence, son URL d'intégration.
  </p>

  <form id="form">
    <input id="url" type="url"
      placeholder="https://..."
      aria-label="URL de la vidéo" required>
    <button class="play">Lire</button>
    <button type="button" id="clear">Effacer</button>
  </form>

  <p id="message" role="status" aria-live="polite"></p>
  <div class="player" id="player"></div>
</main>

<script>
const form = document.querySelector("#form");
const input = document.querySelector("#url");
const player = document.querySelector("#player");
const message = document.querySelector("#message");

// Vérifie un domaine exact ou un véritable sous-domaine.
function isHost(host, domain) {
  return host === domain || host.endsWith("." + domain);
}

function getEmbedUrl(raw) {
  let url;

  try {
    url = new URL(raw.trim());
  } catch {
    throw new Error("Entre une URL valide.");
  }

  if (url.protocol !== "https:" || url.username || url.password) {
    throw new Error("Utilise une URL HTTPS valide.");
  }

  const host = url.hostname.toLowerCase();
  const path = url.pathname;

  // Pornhub : transforme les formats de liens connus.
  if (isHost(host, "pornhub.com")) {
    let id = null;

    if (path === "/view_video.php") {
      id = url.searchParams.get("viewkey");
    } else if (path.startsWith("/embed/")) {
      id = path.split("/")[2];
    }

    if (!id || !/^[a-zA-Z0-9_-]+$/.test(id)) {
      throw new Error(
        "Lien Pornhub non reconnu. Utilise le lien direct ou embed."
      );
    }

    return new URL(
      "/embed/" + encodeURIComponent(id),
      "https://www.pornhub.com"
    );
  }

  // Autres plateformes : accepter seulement une URL
  // embed dont le format a été fourni par le site.
  const supportedHosts = [
    "xvideos.com",
    "xhamster.com",
    "eporner.com",
    "banned.video"
  ];

  const supported = supportedHosts.some(
    domain => isHost(host, domain)
  );

  if (!supported) {
    throw new Error("Plateforme non prise en charge.");
  }

  // Ne pas convertir arbitrairement une page vidéo ordinaire.
  if (!path.toLowerCase().includes("/embed/")) {
    throw new Error(
      "Colle l'URL embed copiée depuis le bouton Partager du site."
    );
  }

  return url;
}

form.addEventListener("submit", event => {
  event.preventDefault();
  player.replaceChildren();
  message.textContent = "";

  try {
    const embedUrl = getEmbedUrl(input.value);

    const iframe = document.createElement("iframe");
    iframe.src = embedUrl.href;
    iframe.title = "Lecteur vidéo intégré";
    iframe.allow = "fullscreen; picture-in-picture";
    iframe.allowFullscreen = true;
    iframe.loading = "lazy";
    iframe.referrerPolicy = "strict-origin-when-cross-origin";

    player.appendChild(iframe);
    message.textContent =
      "Lecteur chargé. La plateforme peut encore refuser l'intégration.";
  } catch (error) {
    message.textContent = error.message;
  }
});

document.querySelector("#clear").addEventListener("click", () => {
  input.value = "";
  player.replaceChildren();
  message.textContent = "";
  input.focus();
});
</script>
</body>
</html>

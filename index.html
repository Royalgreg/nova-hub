
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <title>Video Player</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101010;
      color: #f5f5f5;
      font: 16px/1.5 system-ui, sans-serif;
    }

    header {
      padding: 20px;
      border-bottom: 1px solid #303030;
    }

    header, main {
      width: min(900px, 100%);
      margin-inline: auto;
    }

    header h1 {
      margin: 0;
      color: #ff9900;
      font-size: 25px;
    }

    main { padding: 28px 18px; }

    .subtitle { color: #aaa; }

    form {
      display: flex;
      gap: 10px;
      margin: 24px 0 12px;
    }

    input, button {
      min-height: 48px;
      border-radius: 9px;
      font: inherit;
    }

    input {
      width: 100%;
      min-width: 0;
      padding: 12px;
      border: 1px solid #444;
      background: #202020;
      color: white;
    }

    input:focus-visible, button:focus-visible {
      outline: 2px solid #ff9900;
      outline-offset: 3px;
    }

    button {
      padding: 10px 18px;
      border: 0;
      cursor: pointer;
      font-weight: 700;
    }

    .play {
      background: #ff9900;
      color: #171717;
    }

    .clear {
      background: #303030;
      color: white;
    }

    #message {
      min-height: 24px;
      color: #ccc;
      overflow-wrap: anywhere;
    }

    .player {
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 12px;
      background: #050505;
      border: 1px solid #292929;
    }

    .player iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .hint {
      margin-top: 18px;
      color: #999;
      font-size: 14px;
    }

    @media (max-width: 560px) {
      main { padding: 22px 14px; }
      form { flex-direction: column; }
      form button { width: 100%; }
      header h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Video Player</h1>
  </header>

  <main>
    <h2>Regarder une vidéo</h2>
    <p class="subtitle">
      Colle le lien d'une vidéo pour ouvrir son lecteur intégré.
    </p>

    <form id="videoForm">
      <input
        id="videoUrl"
        type="url"
        placeholder="Colle ton lien vidéo ici..."
        aria-label="Lien de la vidéo"
        autocomplete="url"
        required
      >
      <button class="play" type="submit">Lire la vidéo</button>
      <button class="clear" id="clearButton" type="button">
        Effacer
      </button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
    <div class="player" id="player"></div>

    <p class="hint">
      Certaines vidéos ne permettent pas l'intégration externe.
      Dans ce cas, le lecteur peut rester vide ou afficher une erreur.
    </p>
  </main>

  <script>
    const form = document.querySelector("#videoForm");
    const input = document.querySelector("#videoUrl");
    const player = document.querySelector("#player");
    const message = document.querySelector("#message");

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      player.replaceChildren();
      message.textContent = "";

      let url;
      try {
        url = new URL(input.value.trim());
      } catch {
        message.textContent = "Entre un lien valide.";
        return;
      }

      const host = url.hostname.toLowerCase();
      const allowed =
        url.protocol === "https:" &&
        (host === "pornhub.com" ||
         host.endsWith(".pornhub.com"));

      if (!allowed) {
        message.textContent =
          "Utilise un lien HTTPS provenant de Pornhub.";
        return;
      }

      let id = null;

      if (url.pathname === "/view_video.php") {
        id = url.searchParams.get("viewkey");
      } else if (url.pathname.startsWith("/embed/")) {
        id = url.pathname.split("/")[2];
      }

      if (!id || !/^[a-zA-Z0-9_-]+$/.test(id)) {
        message.textContent =
          "Format de lien non reconnu. Essaie le lien direct de la vidéo.";
        return;
      }

      const iframe = document.createElement("iframe");
      iframe.title = "Lecteur vidéo intégré";
      iframe.allow = "fullscreen";
      iframe.allowFullscreen = true;
      iframe.referrerPolicy = "strict-origin-when-cross-origin";
      iframe.src =
        "https://www.pornhub.com/embed/" +
        encodeURIComponent(id);

      player.appendChild(iframe);
      message.textContent =
        "Lecteur chargé. La lecture dépend des autorisations de la vidéo.";
    });

    document.querySelector("#clearButton").addEventListener("click", () => {
      input.value = "";
      player.replaceChildren();
      message.textContent = "";
      input.focus();
    });
  </script>
</body>
</html>

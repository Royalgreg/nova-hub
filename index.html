
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <title>✦ Nova Hub</title>

  <style>
    :root {
      --bg: #101010;
      --surface: #202020;
      --border: #454052;
      --text: #f5f5f5;
      --muted: #bcb8c9;
      --purple: #a855f7;
      --purple-hover: #9333ea;
      --purple-light: #d8b4fe;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, sans-serif;
    }

    main {
      max-width: 900px;
      margin: auto;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .logo {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border-radius: 14px;
      color: white;
      background: linear-gradient(135deg, #a855f7, #6d28d9);
      box-shadow: 0 0 24px #a855f733;
    }

    .logo svg {
      width: 27px;
      height: 27px;
      fill: currentColor;
    }

    .brand {
      margin: 0;
      font-size: 25px;
      font-weight: 750;
      letter-spacing: -0.8px;
    }

    .brand span {
      color: var(--purple-light);
    }

    .subtitle {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .intro {
      margin-bottom: 20px;
    }

    form {
      display: flex;
      gap: 10px;
      margin: 20px 0;
    }

    input,
    button {
      padding: 12px;
      border-radius: 8px;
      font: inherit;
    }

    input {
      flex: 1;
      min-width: 0;
      background: var(--surface);
      color: white;
      border: 1px solid #555;
      outline: none;
    }

    input:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 3px #a855f72a;
    }

    button {
      cursor: pointer;
      border: 0;
      transition: background 0.2s, transform 0.2s;
    }

    button:active {
      transform: scale(0.97);
    }

    .play {
      background: var(--purple);
      color: white;
      font-weight: bold;
    }

    .play:hover {
      background: var(--purple-hover);
    }

    #clear {
      background: #29252f;
      color: #e5d5f7;
      border: 1px solid var(--border);
    }

    #clear:hover {
      background: #383044;
    }

    .player {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #08070b;
      border: 1px solid #30283b;
      border-radius: 12px;
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    #message {
      overflow-wrap: anywhere;
      color: var(--muted);
      font-size: 14px;
    }

    footer {
      margin-top: 18px;
      color: #777180;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 560px) {
      body {
        padding: 18px;
      }

      form {
        flex-direction: column;
      }

      .brand {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>
<main>
  <header>
    <div class="logo" aria-hidden="true">
      <!-- Étoile à quatre branches -->
      <svg viewBox="0 0 24 24">
        <path d="M12 1.5
          C13.5 7.5 16.5 10.5 22.5 12
          C16.5 13.5 13.5 16.5 12 22.5
          C10.5 16.5 7.5 13.5 1.5 12
          C7.5 10.5 10.5 7.5 12 1.5Z"/>
      </svg>
    </div>

    <div>
      <h1 class="brand">Nova <span>Hub</span></h1>
      <p class="subtitle">Your space. Your videos.</p>
    </div>
  </header>

  <section class="intro">
    <h2>Lecteur vidéo</h2>
    <p>
      Colle un lien vidéo ou, de préférence, son URL d'intégration.
    </p>
  </section>

  <form id="form">
    <input
      id="url"
      type="url"
      placeholder="https://..."
      aria-label="URL de la vidéo"
      required
    >

    <button class="play" type="submit">Lire ↗</button>
    <button type="button" id="clear">Effacer</button>
  </form>

  <p id="message" role="status" aria-live="polite"></p>
  <div class="player" id="player"></div>

  <footer>
    <span style="color:#c084fc">✦</span>
    Nova Hub · Video Space
  </footer>
</main>

<script>
const form = document.querySelector("#form");
const input = document.querySelector("#url");
const player = document.querySelector("#player");
const message = document.querySelector("#message");

function isHost(host, domain) {
  return host === domain || host.endsWith("." + domain);
}

function getEmbedUrl(raw) {
  let url;

  try {
    url = new URL(raw.trim());
  } catch {
    throw new Error("Entre une URL valide.");
  }

  if (
    url.protocol !== "https:" ||
    url.username ||
    url.password
  ) {
    throw new Error("Utilise une URL HTTPS valide.");
  }

  const host = url.hostname.toLowerCase();
  const path = url.pathname;

  // Pornhub : conversion des formats de liens connus.
  if (isHost(host, "pornhub.com")) {
    let id = null;

    if (path === "/view_video.php") {
      id = url.searchParams.get("viewkey");
    } else if (path.startsWith("/embed/")) {
      id = path.split("/")[2];
    }

    if (!id || !/^[a-zA-Z0-9_-]+$/.test(id)) {
      throw new Error(
        "Lien non reconnu. Utilise un lien vidéo ou embed valide."
      );
    }

    return new URL(
      "/embed/" + encodeURIComponent(id),
      "https://www.pornhub.com"
    );
  }

  const supportedHosts = [
    "xvideos.com",
    "xhamster.com",
    "eporner.com",
    "banned.video"
  ];

  const supported = supportedHosts.some(
    domain => isHost(host, domain)
  );

  if (!supported) {
    throw new Error("Plateforme non prise en charge.");
  }

  if (!path.toLowerCase().includes("/embed/")) {
    throw new Error(
      "Colle l'URL embed fournie par la plateforme."
    );
  }

  return url;
}

form.addEventListener("submit", event => {
  event.preventDefault();
  player.replaceChildren();
  message.textContent = "";

  try {
    const embedUrl = getEmbedUrl(input.value);

    const iframe = document.createElement("iframe");
    iframe.src = embedUrl.href;
    iframe.title = "Lecteur vidéo intégré";
    iframe.allow = "fullscreen; picture-in-picture";
    iframe.allowFullscreen = true;
    iframe.loading = "lazy";
    iframe.referrerPolicy = "strict-origin-when-cross-origin";

    player.appendChild(iframe);

    message.textContent =
      "Lecteur chargé. La plateforme peut encore refuser l'intégration.";
  } catch (error) {
    message.textContent = error.message;
  }
});

document.querySelector("#clear").addEventListener("click", () => {
  input.value = "";
  player.replaceChildren();
  message.textContent = "";
  input.focus();
});
</script>
</body>
</html>
